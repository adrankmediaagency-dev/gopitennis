    <style>
      :root {
        --court-green: #2f5233;
        --court-green-light: #3f6b45;
        --clay: #c66b3d;
        --clay-light: #e0895a;
        --line-white: #f4f2ea;
        --charcoal: #16201a;
        --muted: #a9baa9;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        height: 100%;
      }

      body {
        font-family: 'Inter', sans-serif;
        color: var(--line-white);
        background: var(--charcoal);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow-x: hidden;
      }

      /* Court-line backdrop, drawn in CSS instead of a missing bg image */
      .bg-image {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(circle at 20% 15%, rgba(198,107,61,0.18), transparent 45%),
          radial-gradient(circle at 85% 85%, rgba(63,107,69,0.35), transparent 50%),
          linear-gradient(180deg, #16201a 0%, #101711 100%);
        z-index: 0;
      }

      .bg-overlay {
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(244,242,234,0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(244,242,234,0.045) 1px, transparent 1px);
        background-size: 48px 48px;
        z-index: 0;
      }

      .hero {
        position: relative;
        z-index: 1;
        width: 100%;
        padding: 64px 24px;
      }

      .container {
        max-width: 480px;
        margin: 0 auto;
        text-align: center;
      }

      .logo-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        margin-bottom: 40px;
      }

      /* Logo mark: uploaded brand logo, circular with a soft glow */
      .logo-mark {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid rgba(244,242,234,0.25);
        box-shadow: 0 0 0 6px rgba(63,107,69,0.15), 0 10px 30px rgba(0,0,0,0.5);
      }

      .heading1 {
        font-family: 'Bebas Neue', sans-serif;
        font-size: clamp(40px, 9vw, 58px);
        letter-spacing: 2px;
        line-height: 1;
        color: var(--line-white);
      }

      .clr {
        font-size: 14px;
        letter-spacing: 0.5px;
        color: var(--clay-light);
        font-weight: 500;
      }

      .points {
        margin-bottom: 40px;
        border-top: 1px solid rgba(244,242,234,0.15);
        border-bottom: 1px solid rgba(244,242,234,0.15);
        padding: 20px 0;
      }

      .points ul {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .points li {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-size: 15px;
        color: var(--muted);
      }

      .points i {
        color: var(--clay-light);
        width: 18px;
        text-align: center;
      }

      .button-group {
        display: flex;
        justify-content: center;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        font-weight: 600;
        font-size: 16px;
        padding: 15px 34px;
        border-radius: 999px;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      .btn-main {
        background: linear-gradient(135deg, var(--clay-light), var(--clay));
        color: var(--charcoal);
        box-shadow: 0 10px 28px rgba(198,107,61,0.35);
      }

      .btn-main:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 32px rgba(198,107,61,0.45);
      }

      @media (prefers-reduced-motion: reduce) {
        .btn { transition: none; }
      }

      .btn:focus-visible {
        outline: 2px solid var(--line-white);
        outline-offset: 3px;
      }
    </style>
